<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSA Enrollment Forms</title>
    <script src="https://cdn.jsdelivr.net/npm/jsencrypt@latest/bin/jsencrypt.min.js">
    </script>
    
    <link rel="stylesheet" href="css/sursa.css">
</head>

<body>
    <div class="container">
        <h2>Enrollment Form</h2>
        <form id="enrollmentForm">
            <input type="text" id="fullname" placeholder="Full Name" required>
            <input type="date" id="dob" required>
            <input type="text" id="year" placeholder="Year Level" required>
            <select id="gender"><option value="Male">Male</option><option value="Female">Female</option><select>
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="button" id="btnSubmit">Submit & Encrypt</button>
        </form>
            <div id="results">
                <h3>Encryption Results</h3>
                <div id="output1024"></div>
                <div id="output3072"></div>
            </div>
    </div>

    <script src="js/sursa.js"></script>   
</body>
</html>
